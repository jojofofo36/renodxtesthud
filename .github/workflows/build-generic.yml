name: Build RenoDX Generic
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_CACHE_SIZE: "5G"
      SCCACHE_C_CUSTOM_CACHE_BUSTER: "${{ github.workflow }}"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Set up shader tools
        shell: pwsh
        run: .\scripts\setup-dev-env.ps1 -Update -Tools dxc,slang,glslang
      - name: Set up Clang
        uses: egor-tensin/setup-clang@v1
        with:
          version: latest
          platform: x64
      - name: Configure build for amd64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64
      - name: Configure CMake (x64)
        run: cmake --preset clang-x64 -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
      - name: Debug preprocess generic swapchain shader
        shell: pwsh
        run: |
          & ".\bin\fxc.exe" `
            ".\src\games\generic\swap_chain_proxy_pixel_shader.ps_5_x.hlsl" `
            /D __SHADER_TARGET_MAJOR=5 `
            /D __SHADER_TARGET_MINOR=0 `
            /DNDEBUG /Gec /nologo `
            /P ".\preprocessed_generic_swapchain.i"
          Write-Host "=== Nombre de lignes (generic) ==="
          (Get-Content ".\preprocessed_generic_swapchain.i").Count
          Write-Host "=== 'namespace draw' present dans generic ? ==="
          Select-String -Path ".\preprocessed_generic_swapchain.i" -Pattern "namespace draw"
      - name: Debug preprocess haste swapchain shader (control test)
        shell: pwsh
        run: |
          & ".\bin\fxc.exe" `
            ".\src\games\haste\swap_chain_proxy_pixel_shader.ps_5_x.hlsl" `
            /D __SHADER_TARGET_MAJOR=5 `
            /D __SHADER_TARGET_MINOR=0 `
            /DNDEBUG /Gec /nologo `
            /P ".\preprocessed_haste_swapchain.i"
          Write-Host "=== Nombre de lignes (haste) ==="
          (Get-Content ".\preprocessed_haste_swapchain.i").Count
          Write-Host "=== 'namespace draw' present dans haste ? ==="
          Select-String -Path ".\preprocessed_haste_swapchain.i" -Pattern "namespace draw"
      - name: Upload preprocessed files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preprocessed-debug
          path: |
            preprocessed_generic_swapchain.i
            preprocessed_haste_swapchain.i
          if-no-files-found: warn
