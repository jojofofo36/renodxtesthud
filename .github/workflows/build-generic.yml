name: Build RenoDX Generic
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_CACHE_SIZE: "5G"
      SCCACHE_C_CUSTOM_CACHE_BUSTER: "${{ github.workflow }}"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Set up shader tools
        shell: pwsh
        run: .\scripts\setup-dev-env.ps1 -Update -Tools dxc,slang,glslang
      - name: Set up Clang
        uses: egor-tensin/setup-clang@v1
        with:
          version: latest
          platform: x64
      - name: Configure build for amd64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64
      - name: Configure CMake (x64)
        run: cmake --preset clang-x64 -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
      - name: Debug preprocess generic swapchain shader
        shell: pwsh
        run: |
          & ".\bin\fxc.exe" `
            ".\src\games\generic\swap_chain_proxy_pixel_shader.ps_5_x.hlsl" `
            /D __SHADER_TARGET_MAJOR=5 `
            /D __SHADER_TARGET_MINOR=0 `
            /DNDEBUG /Gec /nologo `
            /P ".\preprocessed_generic_swapchain.i"
          Write-Host "=== Recherche de SwapChainPass dans le preprocess ==="
          Select-String -Path ".\preprocessed_generic_swapchain.i" -Pattern "SwapChainPass" -Context 3,3
      - name: Upload preprocessed file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preprocessed-generic-swapchain
          path: preprocessed_generic_swapchain.i
          if-no-files-found: warn
      - name: Build (x64) - generic only
        run: cmake --build --preset clang-x64-release --target renodx-generic.addon64 --verbose
      - name: Show sccache stats
        if: always()
        run: sccache --show-stats
      - name: Locate compiled addon
        id: locate
        shell: pwsh
        run: |
          $file = Get-ChildItem -Path . -Recurse -Filter "renodx-generic.addon64" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $file) {
            Write-Error "renodx-generic.addon64 introuvable"
            exit 1
          }
          Write-Host "Trouve : $($file.FullName)"
          echo "addon_path=$($file.FullName)" >> $env:GITHUB_OUTPUT
      - name: Upload addon artifact
        uses: actions/upload-artifact@v4
        with:
          name: renodx-generic-x64
          path: ${{ steps.locate.outputs.addon_path }}
          if-no-files-found: error
